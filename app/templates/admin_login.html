{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<article>
    <header>
        <h1>Admin Login</h1>
    </header>

    {% if error %}
    <p><mark>Wrong password. Please try again.</mark></p>
    {% endif %}

    <form method="post" action="/admin/login">
        <label for="password">
            Password
            <input type="password" id="password" name="password" required autofocus>
        </label>
        <button type="submit">Login</button>
    </form>
</article>
{% endblock %}
