services:
  wishlist-app:
    build: .
    container_name: wishlist-app
    restart: "no"
    environment:
      APP_BASE_URL: "http://localhost:8000"
      DATABASE_URL: "sqlite+aiosqlite:////data/wishlist.db"
      ADMIN_PASSWORD: "admin"
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
